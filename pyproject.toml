[project]
name = "factcheck-agent"
version = "0.1.0"
description = "FactCheck-Agent: claim verification API scaffolding"
readme = "readme_version_1.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests"
]
addopts = "-q"
